apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: attenza
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: techbabu/attenza-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: attenza-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: attenza
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 8080
      targetPort: 8080